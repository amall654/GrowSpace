name: Redirect legacy GrowSpace links to Firebase

on:
  push:
    branches: [main]
    paths:
      - "Website/legacy-redirect.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare legacy redirects
        run: |
          mkdir -p legacy
          cp Website/legacy-redirect.html legacy/index.html
          cp Website/legacy-redirect.html legacy/404.html
          for route in login auth dashboard demo preview forgot-password reset-password privacy terms; do
            mkdir -p "legacy/$route"
            cp Website/legacy-redirect.html "legacy/$route/index.html"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./legacy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy legacy redirects
        id: deployment
        uses: actions/deploy-pages@v4
